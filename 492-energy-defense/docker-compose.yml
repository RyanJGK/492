version: '3.8'

services:
  # PostgreSQL Database - Live Data Layer
  postgres:
    image: postgres:15-alpine
    container_name: energy-defense-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-energy_defense}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - energy-defense-network

  # Backend API Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy-defense-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-energy_defense}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_cache:/app/.cache
    networks:
      - energy-defense-network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # AI Agent Service
  ai-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.ai
    container_name: energy-defense-ai-agent
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-energy_defense}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ai_cache:/app/.ai_cache
    networks:
      - energy-defense-network
    command: python ai_agent/service.py

  # Redis for AI Agent Caching
  redis:
    image: redis:7-alpine
    container_name: energy-defense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - energy-defense-network

  # Data Ingestion Simulator
  data-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy-defense-simulator
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-energy_defense}
      - SECRET_KEY=${SECRET_KEY:-development-secret-key}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-not-needed-for-simulator}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - energy-defense-network
    command: python scripts/data_simulator.py

  # Frontend Dashboard (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energy-defense-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - energy-defense-network

networks:
  energy-defense-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_cache:
  ai_cache:
